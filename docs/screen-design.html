<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="미리온돈 무료 초대 알파 모바일 퍼스트 반응형 웹 화면설계서. 화면 흐름, 기능 근거, 클릭 가능한 합성 데이터 프로토타입." />
    <title>미리온돈 · 화면설계서</title>
    <style>
      :root {
        color-scheme: light;

        --bg: #f6f5f8;
        --surface: #fff;
        --text: #292431;
        --muted: #716a7d;
        --line: #e5e1eb;
        --primary: #4e376f;
        --soft: #eee8f7;
        --green: #197555;
        --red: #b63c4e;
        --amber: #855b16;
        --warning: #fff6df;
      }
      :root.dark {
        color-scheme: dark;

        --bg: #17151c;
        --surface: #211e28;
        --text: #f2edf9;
        --muted: #b5adbf;
        --line: #3d3648;
        --primary: #d0b7ef;
        --soft: #352a46;
        --green: #8dd7b5;
        --red: #ffa1b0;
        --amber: #edce8b;
        --warning: #392f1e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        line-height: 1.6;
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        outline-offset: 4px;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      a {
        color: var(--primary);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      button {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        cursor: pointer;
        padding: 9px 15px;
      }
      button:hover:not(:disabled) {
        border-color: var(--primary);
      }
      .primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--surface);
      }
      .danger {
        color: var(--red);
      }
      .quiet {
        background: transparent;
        border-color: transparent;
      }
      .small {
        font-size: 12px;
        padding: 5px 10px;
      }
      .balance-edit-icon {
        background: transparent;
        border: 0;
        color: var(--muted);
        display: inline-flex;
        margin-left: 5px;
        padding: 4px;
        vertical-align: middle;
      }
      .balance-edit-icon svg {
        height: 15px;
        width: 15px;
      }
      .asset-disable {
        margin-right: auto;
      }
      .member-group {
        border-top: 1px solid var(--line);
        margin-top: 24px;
        padding-top: 20px;
      }
      .toolbar {
        align-items: center;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        min-height: 66px;
        padding: 12px 22px;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .doc-title {
        font-size: 15px;
        font-weight: 750;
        margin-right: auto;
      }
      .doc-title span {
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        margin-left: 10px;
      }
      .toolbar label {
        align-items: center;
        color: var(--muted);
        display: flex;
        font-size: 12px;
        gap: 6px;
      }
      .toolbar select {
        width: auto;
      }
      .layout {
        display: grid;
        grid-template-columns: 188px minmax(0, 1fr) 268px;
        min-height: calc(100vh - 66px);
      }
      .layout.no-notes {
        grid-template-columns: 188px minmax(0, 1fr);
      }
      .no-notes .notes {
        display: none;
      }
      .sidebar {
        background: var(--surface);
        border-right: 1px solid var(--line);
        padding: 24px 14px;
      }
      .brand {
        color: var(--primary);
        font-size: 25px;
        font-weight: 850;
        letter-spacing: -1.2px;
        padding: 0 12px;
      }
      .brand small {
        color: var(--muted);
        display: block;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      .space {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 10px;
        margin: 23px 0;
        padding: 12px;
      }
      .space small {
        color: var(--muted);
        display: block;
      }
      .nav-label {
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
        margin: 20px 12px 8px;
      }
      .sidebar a {
        border-radius: 7px;
        color: var(--muted);
        display: block;
        margin: 3px 0;
        padding: 9px 12px;
      }
      .sidebar a[aria-current='page'] {
        background: var(--soft);
        color: var(--primary);
        font-weight: 750;
      }
      .sidebar a:hover {
        background: var(--bg);
        text-decoration: none;
      }
      .nav-icon {
        display: inline-block;
        margin-right: 9px;
        text-align: center;
        width: 18px;
      }
      .sidebar-footer {
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 11px;
        margin: 28px 10px 0;
        padding-top: 14px;
      }
      main {
        min-width: 0;
        padding: 30px clamp(20px, 3vw, 46px) 60px;
      }
      .breadcrumb {
        color: var(--muted);
        font-size: 11px;
        margin-bottom: 18px;
      }
      .page-heading {
        align-items: flex-start;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        justify-content: space-between;
        margin-bottom: 26px;
      }
      h1 {
        font-size: 27px;
        font-weight: 750;
        letter-spacing: -1px;
        line-height: 1.3;
        margin: 0 0 8px;
      }
      h2 {
        font-size: 16px;
        letter-spacing: -0.3px;
        margin: 0 0 14px;
      }
      h3 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      p {
        margin: 0 0 14px;
      }
      .muted {
        color: var(--muted);
      }
      .caption {
        color: var(--muted);
        font-size: 12px;
      }
      .actions {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .stack {
        display: grid;
        gap: 18px;
      }
      .grid {
        display: grid;
        gap: 18px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      [hidden] {
        display: none !important;
      }
      .asset-kind-group {
        border: 1px solid var(--line);
        border-radius: 8px;
        margin: 20px 0;
        padding: 16px;
      }
      .asset-kind-group legend {
        padding: 0 6px;
      }
      .grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        min-width: 0;
        padding: 22px;
      }
      .hero {
        background: var(--primary);
        color: var(--surface);
      }
      .hero .caption {
        color: inherit;
        opacity: 0.8;
      }
      .preview-hero {
        background: var(--soft);
        border: 1px solid var(--line);
        border-left: 4px solid var(--primary);
        border-radius: 10px;
        margin-bottom: 16px;
        padding: 16px 18px;
      }
      .preview-hero-head {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .preview-hero .value {
        margin: 4px 0 6px;
      }
      .preview-list {
        border-top: 1px solid var(--line);
        display: grid;
        gap: 10px;
        padding-top: 14px;
      }
      .preview-row {
        align-items: baseline;
        display: grid;
        font-size: 13px;
        gap: 12px;
        grid-template-columns: 120px minmax(0, 1fr);
      }
      .preview-row-label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }
      .preview-row-detail {
        display: grid;
        gap: 3px;
      }
      .value {
        font-size: 30px;
        font-variant-numeric: tabular-nums;
        font-weight: 750;
        letter-spacing: -0.8px;
        line-height: 1.4;
        margin: 8px 0;
      }
      .value.medium {
        font-size: 23px;
      }
      .money {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .positive {
        color: var(--green);
      }
      .negative {
        color: var(--red);
      }
      .badge {
        background: var(--soft);
        border-radius: 5px;
        color: var(--primary);
        display: inline-block;
        font-size: 11px;
        font-weight: 650;
        padding: 3px 8px;
        white-space: nowrap;
      }
      .badge.warning {
        background: var(--warning);
        color: var(--amber);
      }
      .notice {
        background: var(--soft);
        border-left: 3px solid var(--primary);
        border-radius: 7px;
        font-size: 13px;
        margin: 0 0 20px;
        padding: 14px 18px;
      }
      .notice.warning {
        background: var(--warning);
        border-color: var(--amber);
        color: var(--amber);
      }
      .notice.error {
        border-color: var(--red);
        color: var(--red);
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        font-size: 12px;
        text-align: left;
        width: 100%;
      }
      th {
        background: var(--bg);
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
        padding: 12px 10px;
        white-space: nowrap;
      }
      td {
        border-bottom: 1px solid var(--line);
        padding: 14px 10px;
        vertical-align: middle;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      th.right,
      td.right {
        text-align: right;
      }
      .row-title {
        font-weight: 650;
      }
      .row-sub {
        color: var(--muted);
        display: block;
        font-size: 11px;
      }
      .progress {
        background: var(--line);
        border-radius: 4px;
        height: 6px;
        margin: 14px 0 8px;
        overflow: hidden;
      }
      .progress span {
        background: var(--primary);
        display: block;
        height: 100%;
      }
      .tier-progress {
        display: grid;
        gap: 6px;
        margin: 14px 0 10px;
      }
      .tier-progress-track {
        align-items: center;
        display: flex;
        height: 20px;
      }
      .tier-progress-step {
        align-items: center;
        display: flex;
        flex: 1;
        min-width: 0;
        position: relative;
      }
      .tier-progress-seg {
        background: var(--line);
        flex: 1;
        height: 6px;
        overflow: hidden;
      }
      .tier-progress-seg > span {
        background: var(--primary);
        display: block;
        height: 100%;
      }
      .tier-progress-step:first-child .tier-progress-seg {
        border-radius: 3px 0 0 3px;
      }
      .tier-progress-step:last-child .tier-progress-seg {
        border-radius: 0 3px 3px 0;
      }
      .tier-progress-mark {
        background: var(--line);
        border: 1px solid var(--muted);
        border-radius: 50%;
        box-sizing: border-box;
        height: 10px;
        position: absolute;
        right: 0;
        transform: translateX(50%);
        width: 10px;
      }
      .tier-progress-mark.achieved {
        background: var(--primary);
        border-color: var(--primary);
      }
      .tier-progress-labels {
        color: var(--muted);
        display: flex;
        font-size: 11px;
      }
      .tier-progress-labels > span {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
        text-align: right;
      }
      .tier-progress-labels > span.achieved {
        color: var(--primary);
        font-weight: 600;
      }
      .overview-month {
        display: grid;
        gap: 18px;
        grid-template-areas: 'balance tasks' 'data data' 'budget budget' 'cards cards';
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .overview-balance {
        grid-area: balance;
      }
      .overview-tasks {
        grid-area: tasks;
      }
      .overview-data {
        grid-area: data;
        margin: 0;
      }
      .overview-budget {
        grid-area: budget;
        min-width: 0;
      }
      .overview-cards {
        grid-area: cards;
        min-width: 0;
      }
      .category-mobile {
        display: none;
      }
      .category-mobile-item {
        border-top: 1px solid var(--line);
        padding: 14px 0;
      }
      .category-mobile-amounts {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin: 8px 0;
      }
      .field {
        display: grid;
        gap: 7px;
        margin-bottom: 17px;
      }
      .field label,
      .field-label {
        font-size: 12px;
        font-weight: 650;
      }
      input:not([type='checkbox'], [type='radio']),
      select,
      textarea {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--text);
        min-width: 0;
        padding: 10px 12px;
        width: 100%;
      }
      .input-with-btn {
        align-items: center;
        display: flex;
        gap: 8px;
      }
      .input-with-btn input {
        flex: 1;
        min-width: 0;
        width: auto;
      }
      .input-with-btn button {
        flex-shrink: 0;
        white-space: nowrap;
      }
      input[type='checkbox'],
      input[type='radio'] {
        accent-color: var(--primary);
        height: 16px;
        vertical-align: middle;
        width: 16px;
      }
      textarea {
        min-height: 80px;
      }
      .checks {
        align-items: flex-start;
        display: flex;
        gap: 9px;
        margin: 12px 0;
      }
      .form-footer {
        border-top: 1px solid var(--line);
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 24px;
        padding-top: 20px;
      }
      .form-error {
        color: var(--red);
        font-size: 12px;
        margin-top: 6px;
      }
      .steps {
        display: flex;
        gap: 6px;
        margin-bottom: 24px;
      }
      .step {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--muted);
        flex: 1;
        font-size: 11px;
        padding: 10px 7px;
        text-align: center;
      }
      .step.active {
        background: var(--soft);
        border-color: var(--primary);
        color: var(--primary);
        font-weight: 700;
      }
      .tabs {
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-bottom: 20px;
        padding-bottom: 10px;
      }
      .tabs button[aria-pressed='true'] {
        background: var(--soft);
        color: var(--primary);
      }
      .empty {
        color: var(--muted);
        padding: 65px 25px;
        text-align: center;
      }
      .empty strong {
        color: var(--text);
        display: block;
        font-size: 18px;
        margin-bottom: 10px;
      }
      .flow-line {
        align-items: stretch;
        display: flex;
        gap: 8px;
        margin: 16px 0;
      }
      .flow-node {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--text);
        flex: 1;
        min-width: 0;
        padding: 18px 12px;
      }
      .flow-node strong {
        display: block;
        font-size: 13px;
      }
      .flow-node small {
        color: var(--muted);
        display: block;
        font-size: 10px;
        margin-top: 6px;
      }
      .flow-arrow {
        align-self: center;
        color: var(--muted);
      }
      .index-list {
        display: grid;
        gap: 9px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .index-list a {
        background: var(--bg);
        border-radius: 7px;
        font-size: 12px;
        padding: 12px;
      }
      .notes {
        background: var(--surface);
        border-left: 1px solid var(--line);
        font-size: 12px;
        padding: 26px 22px;
      }
      .notes-inner {
        position: sticky;
        top: 94px;
      }
      .notes h2 {
        font-size: 14px;
      }
      .notes h3 {
        border-top: 1px solid var(--line);
        font-size: 11px;
        margin-top: 20px;
        padding-top: 17px;
      }
      .notes ol,
      .notes ul {
        color: var(--muted);
        padding-left: 18px;
      }
      .notes li {
        margin-bottom: 9px;
      }
      .notes code {
        background: var(--bg);
        color: var(--primary);
        font-size: 11px;
        padding: 2px 4px;
      }
      .notes a {
        display: inline-block;
        margin: 3px 6px 3px 0;
      }
      .split-line {
        align-items: center;
        display: flex;
        gap: 10px;
        justify-content: space-between;
        margin: 10px 0;
      }
      .total-line {
        border-top: 1px solid var(--line);
        font-weight: 750;
        margin-top: 16px;
        padding-top: 14px;
      }
      .fund-summary th:last-child,
      .fund-summary td:last-child {
        background: var(--soft);
        color: var(--primary);
        font-weight: 750;
        text-align: right;
      }
      .fund-summary td:last-child .money {
        color: var(--primary);
        font-size: 20px;
        font-weight: 750;
      }
      .selection-bar {
        align-items: center;
        background: var(--soft);
        border-radius: 9px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: space-between;
        margin-top: 18px;
        padding: 17px;
      }
      .login {
        margin: 35px auto;
        max-width: 440px;
        padding: 36px;
        text-align: center;
      }
      .login h1 {
        margin-top: 22px;
      }
      .kakao {
        background: #fee500;
        border-color: #fee500;
        color: #191919;
        margin: 16px 0;
        width: 100%;
      }
      .drop-zone {
        background: var(--bg);
        border: 1px dashed var(--primary);
        border-radius: 12px;
        padding: 30px;
        text-align: center;
      }
      .line-item {
        align-items: end;
        display: grid;
        gap: 10px;
        grid-template-columns: 1.3fr 1fr 1fr auto;
      }
      .line-item.deduction {
        grid-template-columns: 1.4fr 1fr auto;
      }
      .line-item.line-head {
        align-items: center;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .line-item[data-salary-pay-row],
      .line-item[data-salary-deduct-row] {
        align-items: center;
        margin-bottom: 8px;
      }
      .line-item .field {
        margin-bottom: 10px;
      }
      [data-split-row] > button {
        margin-bottom: 10px;
      }
      .salary-group {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
      }
      dialog {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 15px;
        color: var(--text);
        max-height: 85vh;
        max-width: 520px;
        padding: 28px;
        width: calc(100% - 36px);
      }
      dialog.wide {
        max-width: 720px;
      }
      dialog::backdrop {
        background: #17102080;
      }
      .toast {
        background: var(--text);
        border-radius: 10px;
        bottom: 24px;
        color: var(--surface);
        left: 50%;
        max-width: 90vw;
        padding: 14px 22px;
        position: fixed;
        transform: translateX(-50%);
        z-index: 30;
      }
      .toast:empty {
        display: none;
      }
      .skip {
        background: var(--surface);
        left: 12px;
        padding: 10px;
        position: absolute;
        top: -100px;
        z-index: 50;
      }
      .skip:focus {
        top: 10px;
      }
      .skeleton {
        background: var(--line);
        border-radius: 7px;
        height: 26px;
        margin: 20px 0;
        width: 80%;
      }
      .stamp {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 1px;
        margin-bottom: 12px;
        text-transform: uppercase;
      }

      @media (width < 1200px) {
        .layout {
          grid-template-columns: 164px minmax(0, 1fr);
        }
        .notes {
          border-top: 1px solid var(--line);
          grid-column: 2;
        }
        .notes-inner {
          position: static;
        }
        .grid.three {
          grid-template-columns: 1fr;
        }
      }

      @media (width < 768px) {
        .overview-month {
          grid-template-areas: 'balance' 'data' 'budget' 'tasks' 'cards';
          grid-template-columns: minmax(0, 1fr);
        }
        .category-desktop {
          display: none;
        }
        .category-mobile {
          display: block;
        }
        .toolbar {
          position: static;
        }
        .doc-title {
          width: 100%;
        }
        .layout,
        .layout.no-notes {
          grid-template-columns: minmax(0, 1fr);
        }
        .sidebar {
          padding: 12px;
        }
        .sidebar nav {
          display: flex;
          flex-wrap: wrap;
        }
        .sidebar a {
          font-size: 11px;
          padding: 6px 9px;
        }
        .brand,
        .space,
        .nav-label,
        .sidebar-footer {
          display: none;
        }
        main {
          padding: 22px 16px;
        }

        const divisor = BigInt(amount);
        const allocated = parts.map((part, index) => {
          const product = BigInt(discount) * BigInt(part.gross);
          return { ...part, index, share: Number(product / divisor), remainder: product % divisor };
        });
        const leftover = discount - allocated.reduce((sum, part) => sum + part.share, 0);
        [...allocated]
          .sort((a, b) => (a.remainder === b.remainder ? a.index - b.index : a.remainder > b.remainder ? -1 : 1))

          if (invalid) {
            notify('송금계좌를 확인해야 할 거래가 있어요. 지출 상세에서 계좌를 먼저 선택해 주세요.');

          }
          state.bulkPending = rows.map((r) => ({
            id: r.id,
            transactionId: r.transactionId,
            person: r.person,
            amount: r.amount - r.paid - (r.cancelled || 0),
            sourceAccount: r.sourceAccount || 'external'
          }));
          const people = [...new Set(state.bulkPending.map((r) => r.person))];
          const accounts = people
            .map(
              (person, i) =>
                `<section class="card"><strong>${esc(personName(person))} · ${won(state.bulkPending.filter((r) => r.person === person).reduce((sum, r) => sum + r.amount, 0))}</strong>${select(`bulk-account-${i}`, `${personName(person)} 입금 계좌`, destinationOptions(), 'asset:0')}</section>`
            )
            .join('');
          const summary = state.bulkPending
            .map((r) => {
              const t = state.transactions.find((t) => t.id === r.transactionId);
              return `<li>${esc(t?.name || '지출')} · ${esc(personName(r.person))} · ${won(r.amount)} · ${esc(sourceLabel(r.sourceAccount))}</li>`;
            })
            .join('');
          modal(
            '회수 완료',
            `<p>선택한 거래 ${new Set(rows.map((r) => r.transactionId)).size}건 · 총 ${won(rows.reduce((sum, r) => sum + r.amount - r.paid - (r.cancelled || 0), 0))}</p><ul>${summary}</ul>${accounts}<p class="caption">회수한 금액을 기록해요. 같은 상대·송금계좌의 선택 건은 하나로 묶어 기록하며, 실제 계좌 잔액은 자동으로 바뀌지 않아요.</p><div id="bulk-error" class="form-error" role="alert"></div>`,
            'bulk-receivable-commit',
            '회수한 금액 기록'
          );
        },
        'bulk-receivable-commit': () => {
          const items = state.bulkPending || [];
          const people = [...new Set(items.map((r) => r.person))];
          const destinations = new Map(people.map((person, i) => [person, $(`#bulk-account-${i}`)?.value]));
          const invalid = items.some((item) => {
            const r = receivables().find((r) => r.id === item.id);
            return (
              !r ||
              r.person !== item.person ||
              (r.sourceAccount || 'external') !== item.sourceAccount ||
              r.amount - r.paid - (r.cancelled || 0) !== item.amount ||
              (isLedgerMember(r.person) && !sourceOptions(r.person).some(([v]) => v === r.sourceAccount)) ||
              !destinationOptions().some(([v]) => v === destinations.get(item.person)) ||
              item.sourceAccount === destinations.get(item.person)
            );
          });
          if (!items.length || invalid) {
            $('#bulk-error').textContent = '거래와 송금·입금계좌를 다시 확인해 주세요. 같은 계좌 간 입금은 기록할 수 없어요.';
            return;
          }
          const groups = new Map();
          items.forEach((item) => {
            const key = JSON.stringify([item.person, item.sourceAccount]);
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push({ id: item.id, amount: item.amount, sourceAccount: item.sourceAccount, destinationAccount: destinations.get(item.person) });
          });
          items.forEach((item) => {
            receivables().find((r) => r.id === item.id).paid += item.amount;
          });
          for (const allocations of groups.values()) {
            const total = allocations.reduce((sum, a) => sum + a.amount, 0);
            const destinationAccount = allocations[0].destinationAccount;
            const entry = { allocations, total, account: sourceLabel(destinationAccount), destinationAccount };
            state.settled += total;
            state.settlementHistory.push(entry);
            state.lastSettlement = entry;
          }
          state.bulkPending = null;
          state.bulkReceivableSelection.clear();
          closeModal();
          render();
          notify('선택한 거래의 회수 완료를 기록했어요.');
        },

        'expense-save': () => {
          if (!formValid('expense-form') || !validateReceivables()) return;
          const v = expenseValues();
          const error = $('#expense-error');
          error.textContent = '';
          const old = state.transactions.find((t) => t.id === editing);
          const isInstallmentPayment = old ? Boolean(old.installment) : $('#expense-payment')?.value === '할부';
          if (isInstallmentPayment && !old && ($('#expense-card').value === '현금' || isExpenseAccount($('#expense-card').value))) {
            error.textContent = '할부는 카드 결제수단을 선택해 주세요.';
            return;
          }
          const approvalInput = Number($('#expense-amount').value);
          const discountInput = Number($('#expense-discount').value);
          const instType = $('#installment-type')?.value || old?.installmentType || '무이자';
          const instCount = Number($('#installment-count')?.value || old?.installmentCount || 3);
          const instCurrent = Number($('#installment-current')?.value || old?.installmentCurrent || 1);
          const isInterestBearing = isInstallmentPayment && instType !== '무이자';
          const instPrincipalInput = Number($('#installment-principal')?.value);
          const instInterestInput = Number($('#installment-interest')?.value || 0);
          if (isInterestBearing) {
            if (!Number.isSafeInteger(instPrincipalInput) || instPrincipalInput <= 0 || !Number.isSafeInteger(instInterestInput) || instInterestInput < 0) {
              error.textContent = '이번 회차 납부원금(1원 이상)과 이자·수수료(0원 이상)를 원 단위 정수로 입력해 주세요.';
              return;
            }
          }
          if (isInstallmentPayment && !old) {
            if (!Number.isSafeInteger(approvalInput) || approvalInput <= 0 || !Number.isSafeInteger(discountInput) || discountInput < 0 || discountInput > approvalInput) {
              error.textContent = '할부 승인금액과 할인은 0원 이상 원 단위 정수로 올바르게 입력해 주세요.';
              return;
            }
            if (!Number.isInteger(instCount) || instCount < 2 || instCount > 36 || !Number.isInteger(instCurrent) || instCurrent < 1 || instCurrent > instCount) {
              error.textContent = '할부 개월 수(2~36개월)와 이번 회차 번호를 확인해 주세요.';
              return;
            }
          }
          if (![v.amount, v.discount, v.received, ...v.parts.map((part) => part.gross)].every(Number.isSafeInteger)) {
            error.textContent = '금액은 원 단위의 정수로 입력해 주세요.';
            return;
          }
          if (!isInstallmentPayment && v.discount > v.amount) {
            fieldError('expense-discount', '카드사 할인은 결제금액을 넘을 수 없어요.');
            return;
          }
          if (v.split) {
            const missingCategory = v.parts.findIndex((part) => !part.category);
            if (missingCategory !== -1) {
              error.textContent = `분류 ${missingCategory + 1} 항목을 선택해 주세요.`;
              $(`#split-category-${missingCategory + 1}`).focus();
              return;
            }
            const missingAmount = v.parts.findIndex((part) => !part.entered || part.gross <= 0);
            if (missingAmount !== -1) {
              error.textContent = `분류 ${missingAmount + 1}의 금액을 0원보다 크게 입력해 주세요.`;
              $(`#split-amount-${missingAmount + 1}`).focus();
              return;
            }
          }
          if (v.split && v.splitTotal !== v.amount) {
            error.textContent = `분할 합계 차액 ${won(v.amount - v.splitTotal)}을 수정해 주세요.`;
            return;
          }
          if (v.split) {

        'category-disable': (el) => {
          if (!canConfigure()) return;
          const cat = el.dataset.value;
          const hasFixedOrInstallment =
            state.transactions.some((t) => (t.recurring || t.scheduled || t.installment) && (t.category === cat || (t.allocations && t.allocations.some((a) => a.category === cat)))) ||
            (state.fixedExpenses || []).some((r) => r.active && r.category === cat) ||
            (state.installmentPlans || []).some((p) => installmentPlanState(p) === 'active' && p.category === cat);
          if (hasFixedOrInstallment) {
            modal(
              '분류 비활성화 불가',
              `<p><strong>${esc(cat)}</strong> 분류에 연결된 고정 지출 또는 남은 할부 거래가 있어요.</p><p class="caption">고정 지출이나 할부·거래의 분류를 다른 분류로 바꾸거나 정리한 뒤 다시 시도해 주세요.</p>`,
              'close-modal',
              '확인'
            );
            return;
          }
          const hasFutureTransactions = state.transactions.some((t) => t.month > state.month && (t.category === cat || (t.allocations && t.allocations.some((a) => a.category === cat))));
          if (hasFutureTransactions) {
            modal(
              '분류 비활성화 불가',
              `<p><strong>${esc(cat)}</strong> 분류에 다음 달 이후로 예정된 거래가 있어요.</p><p class="caption">미래 월 거래의 분류를 먼저 다른 분류로 바꾸거나 삭제해 주세요.</p>`,
              'close-modal',
              '확인'
            );
            return;
          }
          const idx = categories.indexOf(cat);
          const expense = monthTransactions().reduce(
            (sum, t) => sum + (t.allocations ? t.allocations.filter((a) => a.category === cat).reduce((v, a) => v + a.amount, 0) : t.category === cat ? t.expense : 0),
            0
          );
          const cancelled = monthTransactions()
            .filter((t) => !t.receivableCurrent && !t.allocations && t.category === cat)
            .reduce((sum, t) => sum + cancelledFor(t.id), 0);
          const netRemaining = (state.budget[idx] || 0) + (state.carry[idx] || 0) - expense - cancelled;
          state.disablingCategory = cat;
          state.disablingIndex = idx;
          state.disablingRemaining = netRemaining;
          const targets = categories.filter((c) => c !== cat && !(state.disabledCategories || []).includes(c));
          if (netRemaining === 0) {
            modal(
              '분류 비활성화',
              `<p><strong>${esc(cat)}</strong> 분류의 이번 달 잔여금이 0원이에요.</p><p class="caption">비활성화하면 기본 예산이 0원이 되고 새 지출 입력에서는 빠지지만, 과거 거래와 월별 통계는 그대로 남아요.</p>`,
              'confirm-category-disable-zero',
              '비활성화'
            );
          } else if (netRemaining > 0) {
            modal(
              '분류 비활성화 · 잔여 예산 정산',
              `<p><strong>${esc(cat)}</strong> 분류에 이번 달 잔여금 <strong>${won(netRemaining)}</strong>이 남아 있어요.</p><p class="caption">남은 금액을 넘겨받을 활성 분류를 선택하면 장부 합계와 이월 오차 없이 비활성화돼요.</p><div class="field" style="margin:16px 0">${select('disable-target-cat', '잔여금을 넘겨받을 활성 분류', targets)}</div>`,
              'confirm-category-disable-transfer',
              '잔여금 이전 후 비활성화'
            );
          } else {
            modal(
              '분류 비활성화 · 초과 지출 충당',
              `<p><strong>${esc(cat)}</strong> 분류에 이번 달 <strong>${won(Math.abs(netRemaining))}</strong>의 초과 지출이 있어요.</p><p class="caption">초과분을 충당할 활성 분류를 선택하면 다른 분류 예산에서 메꿔 장부 오차 없이 비활성화돼요.</p><div class="field" style="margin:16px 0">${select('disable-target-cat', '초과금을 충당할 활성 분류', targets)}</div>`,
              'confirm-category-disable-offset',
              '충당 후 비활성화'
            );
          }
        },
        'confirm-category-disable-zero': () => {
          const cat = state.disablingCategory;
          const idx = state.disablingIndex;
          state.defaultBudget[idx] = 0;
          state.disabledCategories = state.disabledCategories || [];
          if (!state.disabledCategories.includes(cat)) state.disabledCategories.push(cat);
          closeModal();
          render();
          notify(`'${cat}' 분류를 비활성화했어요.`);
        },
        'confirm-category-disable-transfer': () => {
          const cat = state.disablingCategory;
          const idx = state.disablingIndex;
          const rem = state.disablingRemaining;
          const target = $('#disable-target-cat')?.value;
          if (!target) return;
          const targetIdx = categories.indexOf(target);
          state.budget[idx] -= rem;
          state.budget[targetIdx] += rem;
          state.defaultBudget[idx] = 0;
          state.disabledCategories = state.disabledCategories || [];
          if (!state.disabledCategories.includes(cat)) state.disabledCategories.push(cat);
          closeModal();
          render();
          notify(`'${cat}' 분류를 비활성화하고 잔여금 ${won(rem)}을 '${target}' 예산으로 옮겼어요.`);
        },
        'confirm-category-disable-offset': () => {
          const cat = state.disablingCategory;
          const idx = state.disablingIndex;
          const absRem = Math.abs(state.disablingRemaining);
          const target = $('#disable-target-cat')?.value;
          if (!target) return;
          const targetIdx = categories.indexOf(target);
          state.budget[idx] += absRem;
          state.budget[targetIdx] -= absRem;
          state.defaultBudget[idx] = 0;
          state.disabledCategories = state.disabledCategories || [];
          if (!state.disabledCategories.includes(cat)) state.disabledCategories.push(cat);
          closeModal();
          render();
          notify(`'${cat}' 분류를 비활성화하고 초과금 ${won(absRem)}을 '${target}' 예산에서 충당했어요.`);
        },
        'category-restore': (el) => {

            categories.splice(idx, 1);

            state.budget.splice(idx, 1);
            state.carry.splice(idx, 1);
            Object.keys(state.monthBudgets).forEach((m) => state.monthBudgets[m]?.splice(idx, 1));
            render();
            notify(`'${cat}' 분류를 삭제했어요.`);
          }
        },

        if (el.closest('#expense-form')) updateExpensePreview();
        if (el.closest('#income-form') && state.incomeType === '근로소득') updateSalarySummaryUI('inc');
        if (el.closest('[data-salary-editor="fixed"]')) updateSalarySummaryUI('fixed');
        const moneyEditor = event.target.closest('[data-income-money-editor]');
        if (moneyEditor) {
          const prefix = moneyEditor.dataset.incomeMoneyEditor;
          updateIncomeMoneySummary(prefix, prefix === 'income' ? state.incomeType : $('#fixed-inc-type').value);
        }
      });
      document.addEventListener(
        'scroll',
        (event) => {
          if (event.target.id !== 'annual-matrix') return;
          const container = event.target;
          const control = document.querySelector('[data-action="annual-matrix-toggle"]');
          if (control) control.textContent = container.scrollLeft + container.clientWidth >= container.scrollWidth - 2 ? '← 1월로 이동' : '연간 합계로 이동 →';
        },
        true
      );
      document.addEventListener('paste', (event) => {
        if (!event.target.closest('#expense-assist')) return;
        const file = [...(event.clipboardData?.items || [])].find((item) => item.kind === 'file' && item.type.startsWith('image/'))?.getAsFile();
        if (file) {
          event.preventDefault();
          setExpenseAssistImage(file);
        }
      });
      document.addEventListener('dragover', (event) => {
        if (event.target.closest('#expense-assist')) event.preventDefault();
      });
      document.addEventListener('drop', (event) => {
        if (event.target.closest('#expense-assist')) {
          event.preventDefault();
          setExpenseAssistImage(event.dataTransfer?.files?.[0]);
        }
      });
      document.addEventListener('input', (event) => {
        if (event.target.id === 'expense-assist-text') {
          expenseAssist.text = event.target.value;
          expenseAssist.candidate = null;
          expenseAssist.sequence++;
          document.querySelector('[data-action="expense-assist-review"]').disabled = false;
          $('#expense-assist-status').textContent = '';
        }
        if (['expense-amount', 'expense-discount', 'installment-count', 'installment-current', 'installment-type'].includes(event.target.id)) suggestInstallmentAmount();
        captureDraft();
        if (event.target.closest('#month-budget-form')) {
          const values = categories.map((_, i) => Number($(`#month-budget-${i}`).value) || 0);
          $('#month-budget-comparison').innerHTML = budgetComparison(values);
        }
        event.target.removeAttribute('aria-invalid');
        if (event.target.closest('#manage-form')) {
          readReceivableModal();
          updateManagePreview();
        }
        if (event.target.closest('#expense-form')) updateExpensePreview();
        if (event.target.closest('#income-form') && state.incomeType === '근로소득') updateSalarySummaryUI('inc');
        if (event.target.closest('[data-salary-editor="fixed"]')) updateSalarySummaryUI('fixed');
        const moneyEditor = event.target.closest('[data-income-money-editor]');
        if (moneyEditor) {
          const prefix = moneyEditor.dataset.incomeMoneyEditor;
          updateIncomeMoneySummary(prefix, prefix === 'income' ? state.incomeType : $('#fixed-inc-type').value);
        }
        if (event.target.id === 'expense-search' || event.target.id === 'expense-card-filter') filterExpenses();
      });
      document.addEventListener('change', (event) => {
        if (event.target.id === 'income-type') actions['income-type']({ dataset: { value: event.target.value } });
        if (event.target.id === 'installment-type') {
          suggestInstallmentAmount();
          updateExpensePreview();
        }
        if (event.target.id === 'fixed-inc-type') {
          const type = $('#fixed-inc-type').value;
          if (state.fixedIncomeType === '근로소득') state.fixedIncomeSalaryDraft = salaryEditorValues('fixed');
          state.fixedIncomeType = type;
          const isSalary = type === '근로소득';
          $('#fixed-inc-salary-section').hidden = !isSalary;
          $('#fixed-inc-money-details').hidden = isSalary;
          const rule = state.fixedIncomes.find((i) => i.id === state.editingFixedIncomeId);
          $('#fixed-inc-money-details').innerHTML = isSalary ? '' : incomeMoneyDetailsHtml('fixed-inc', type, rule?.type === type ? incomeRecordDetails(rule) : null);
          $('#fixed-inc-kind-details').innerHTML = incomeKindDetailsHtml('fixed-inc', type, rule?.type === type ? rule.taxDetails : {});
          $('#fixed-inc-subtype').value = rule?.type === type ? rule.subtype || '' : '';
          $('#fixed-inc-subtypes').innerHTML = (incomeSubtypes[type] || []).map((value) => `<option value="${esc(value)}"></option>`).join('');
          if (isSalary) updateSalarySummaryUI('fixed');
          else updateIncomeMoneySummary('fixed-inc', type);
        }
        if (event.target.id === 'card-issuer') {
          Object.assign(state.cardRegistration, { issuer: event.target.value, issuerOther: '', query: '', searchDone: false, aiDone: false });
          render();
        }
        if (event.target.id === 'asset-class') {
          updateAssetTypes();
          updateAssetFields();
        }
        if (['asset-type', 'asset-holding', 'asset-counterparty', 'asset-valuation', 'asset-owner'].includes(event.target.id)) updateAssetFields();
        if (event.target.id === 'card-transit' && state.cardRegistration.product?.type === '체크카드') {
          $('#card-transit-fields').hidden = !event.target.checked;
          if (event.target.checked && !$('#card-transit-account').value) $('#card-transit-account').value = $('#card-account').value;
        }
        if (event.target.id === 'annual-owner-all') {
          state.annualOwners = event.target.checked ? null : [];
          state.annualOwnerMenuOpen = true;
          render();
        }
        if (event.target.matches('[data-annual-owner]')) {
          const choice = event.target.dataset.annualOwner;
          const current = state.annualOwners === null ? [...document.querySelectorAll('[data-annual-owner]')].map((input) => input.dataset.annualOwner) : state.annualOwners;
          state.annualOwners = event.target.checked ? [...current.filter((name) => name !== choice), choice] : current.filter((name) => name !== choice);
          state.annualOwnerMenuOpen = true;
          render();
        }
        if (event.target.id === 'annual-category-all') {
          state.annualCategories = event.target.checked ? null : [];
          state.annualCategoryMenuOpen = true;
          render();
        }
        if (event.target.matches('[data-annual-category]')) {
          const choice = event.target.dataset.annualCategory;
          const current = state.annualCategories === null ? [...document.querySelectorAll('[data-annual-category]')].map((input) => input.dataset.annualCategory) : state.annualCategories;
          state.annualCategories = event.target.checked ? [...current.filter((name) => name !== choice), choice] : current.filter((name) => name !== choice);
          state.annualCategoryMenuOpen = true;
          render();
        }
        if (event.target.id === 'installment-card-filter') {
          state.installmentCardFilter = event.target.value;
          render();
        }
        if (event.target.id === 'expense-card-filter') filterExpenses();
      });
      const filterExpenses = () => {
        state.bulkReceivableSelection.clear();
        if (current === 'receivables') {
          state.receivableSearch = $('#expense-search').value;
          state.receivableCardFilter = $('#expense-card-filter').value;
        } else {
          state.expenseSearch = $('#expense-search').value;
          state.expenseCardFilter = $('#expense-card-filter').value;
        }
        if (current === 'receivables' && state.receivableTab === 'waiting') $('#bulk-receivable-bar').innerHTML = bulkSelectionBar();
        $('#expense-list').innerHTML = current === 'receivables' ? expenseTable(filteredExpenses(), state.receivableTab === 'waiting') : expenseSectionsHtml(filteredExpenses());
        if (current === 'receivables') updateExpenseSelectAll();
      };
      $('#role').addEventListener('change', (event) => {
        state.role = event.target.value;
        if (state.role !== 'owner' && state.settingsSection === 'ledger') state.settingsSection = 'budget';
        render();
      });
      $('#view-state').addEventListener('change', (event) => {
        state.view = event.target.value;
        render();
      });
      $('#theme').addEventListener('click', () => {
        const dark = document.documentElement.classList.toggle('dark');
        $('#theme').setAttribute('aria-pressed', String(dark));
        $('#theme').textContent = dark ? '라이트 모드' : '다크 모드';
      });
      $('#toggle-notes').addEventListener('click', () => {
        const hidden = $('#layout').classList.toggle('no-notes');
        $('#toggle-notes').setAttribute('aria-pressed', String(!hidden));
        $('#toggle-notes').textContent = hidden ? '설계 설명 꺼짐' : '설계 설명 켜짐';
      });
      $('#reset').addEventListener('click', () => {
        modal('데모를 초기 상태로 되돌릴까요?', '<p>이 화면에서 입력한 예시 데이터만 초기화해요. 실제 서비스 기록에는 영향이 없어요.</p>', 'reset-confirm', '데모 초기화');
      });
      actions['reset-confirm'] = () => {
        closeModal();
        categories.splice(5);
        state = initial();
        editing = null;
        $('#role').value = 'owner';
        $('#view-state').value = 'normal';
        render();
        notify('데모 초기화 완료');
      };
      $('#modal').addEventListener('cancel', () => {
        setTimeout(() => modalFocus?.focus(), 0);
      });
      window.addEventListener('pagehide', () => clearExpenseAssist(false));
      window.addEventListener('hashchange', () => {
        state.view = 'normal';
        $('#view-state').value = 'normal';
        render();
        $('#main').focus();
        window.scrollTo({ top: state.focusSetupReturn && current === 'onboarding' ? state.setupReturnScroll || 0 : 0, behavior: 'instant' });
        if (state.focusSetupReturn && current === 'onboarding') {
          document.querySelector('#setup-form input,#setup-form select')?.focus({ preventScroll: true });
          state.focusSetupReturn = false;
        }
      });
      render();
    </script>
  </body>
</html>
